version: 2

builds:
  - main: .
    binary: shopgen
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ['-s -w -X github.com/weekwright/shopgen/cmd.Version={{.Version}}']
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, profile.example.json, examples/*]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:']
