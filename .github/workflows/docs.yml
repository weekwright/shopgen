name: Docs

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - mkdocs.yml
      - overrides/**
      - hooks/**
      - scripts/sync-docs.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - README.md
      - docs/**
      - mkdocs.yml
      - overrides/**
      - hooks/**
      - scripts/sync-docs.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Site pages match README.md
        run: python3 scripts/sync-docs.py --check
      - name: Build (fails on broken links)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    # Pull requests only build. Deploying needs Settings → Pages → Source:
    # "GitHub Actions".
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
